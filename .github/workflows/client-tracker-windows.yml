name: Client Tracker – Windows build

on:
  push:
    paths:
      - 'client_tracker/**'
      - '.github/workflows/client-tracker-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: flutter build windows --release --dart-define=SUPABASE_URL="$env:SUPABASE_URL" --dart-define=SUPABASE_KEY="$env:SUPABASE_KEY"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: client_tracker-windows-x64
          path: client_tracker/build/windows/x64/runner/Release/
          if-no-files-found: error
