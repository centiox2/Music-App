# Builds Sonder on Metrolist KMP (branch claude/sonder-metrolist) and publishes the APK at a fixed
# link: https://github.com/centiox2/Music-App/releases/download/sonder-next/Sonder-Next.apk
# Signed with the same key as Sonder (secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD). While the move is in progress the app id is com.coverglow.music.next, so it
# installs beside the current Sonder.
name: Build Sonder (Metrolist)

on:
  workflow_dispatch:
  push:
    branches: ["claude/sonder-metrolist"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=${KEY_ALIAS:-coverglow}"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Verify Sonder appearance and settings
        run: >-
          ./gradlew :androidApp:compileDebugKotlin :shared:testAndroidHostTest --no-daemon --no-configuration-cache
          --tests 'com.metrolist.shared.ui.sonder.SonderAppearanceTest'
          --tests 'com.metrolist.shared.settings.NavigationTabPreferencesTest'
          --tests 'com.metrolist.shared.settings.ExpressiveMiniPlayerSettingsTest'
          --tests 'com.metrolist.shared.settings.LegacySettingsMigrationTest'

      - name: Render Sonder screens
        run: ./gradlew :androidApp:testDebugUnitTest --tests 'com.metrolist.android.SonderScreenshotsTest' --no-daemon --no-configuration-cache

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonder-screen-review
          path: |
            androidApp/build/reports/sonder-screenshots/
            androidApp/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Build
        run: ./gradlew :androidApp:assembleRelease --no-daemon --no-configuration-cache -x :androidApp:lintVitalRelease

      - name: Collect the APK
        run: |
          ls -l androidApp/build/outputs/apk/release/
          apk=$(ls androidApp/build/outputs/apk/release/*.apk | grep -i universal | head -1)
          [ -n "$apk" ] || apk=$(ls androidApp/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" Sonder-Next.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonder-next-apk
          path: Sonder-Next.apk
          retention-days: 7

      - name: Publish (release "sonder-next")
        if: github.ref_name == 'claude/sonder-metrolist'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Sonder on Metrolist KMP (test build) from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
          if gh release view sonder-next > /dev/null 2>&1; then
            gh release upload sonder-next Sonder-Next.apk --clobber
            gh release edit sonder-next --notes "$NOTES"
          else
            gh release create sonder-next Sonder-Next.apk --title "Sonder on Metrolist (test)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
