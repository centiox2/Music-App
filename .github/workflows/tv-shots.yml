# Renders the TV player at 960x540dp (TvPlayerShotsTest) and publishes the PNGs to the
# "tv-shots" release, so the layout can be checked without a TV. Run from the Actions tab.
name: TV screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1" | grep -v "^\[=*" || true
          if [ ! -d "$SDK/platforms/android-37" ]; then
            cp -r "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
            rm -f "$SDK/platforms/android-37/package.xml"
            sed -i 's/^AndroidVersion.ApiLevel=.*/AndroidVersion.ApiLevel=37/' "$SDK/platforms/android-37/source.properties"
            grep -q '^AndroidVersion.ApiLevel=' "$SDK/platforms/android-37/source.properties" || \
              echo "AndroidVersion.ApiLevel=37" >> "$SDK/platforms/android-37/source.properties"
          fi
          echo "sdk.dir=$SDK" > local.properties
      - name: Render
        env:
          GLOW_SHOTS: ${{ github.workspace }}/shots
        run: ./gradlew --no-daemon :app:testDevDebugUnitTest --tests '*TvPlayerShotsTest*' -Pbitchord.bundleWear=false --rerun
      - name: Publish (release "tv-shots")
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l shots || exit 0
          if gh release view tv-shots > /dev/null 2>&1; then
            gh release upload tv-shots shots/*.png --clobber
          else
            gh release create tv-shots shots/*.png --title "TV screenshots" --notes "Rendered by tv-shots.yml" --prerelease --target "$GITHUB_SHA"
          fi
